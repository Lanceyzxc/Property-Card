<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#a71916">
  <title>Access Tag | UCN ProCard System</title>
  <link rel="stylesheet" href="assets/css/login-prototype.css?v=20260914.4">
  <link rel="icon" href="assets/images/ucn.png" type="image/x-icon">
</head>
<body>
  <main class="tag-login-shell">
    <div class="paper-grain" aria-hidden="true"></div>

    <header class="prototype-header">
      <a class="brand-lockup" href="login.html" aria-label="Return to standard login">
        <img src="assets/images/logo.png" alt="University of Northern Philippines logo">
        <span>
          <strong>UCN ProCard</strong>
        </span>
      </a>
    </header>

    <section class="login-stage" aria-labelledby="prototype-title">
      <div class="intro-copy">
        <div class="intro-heading-row">
          <div class="intro-logo-frame">
            <img src="assets/images/ucn.png" alt="University of Northern Philippines seal">
          </div>
          <h1 id="prototype-title">Sign in to your<br><em>property desk.</em></h1>
        </div>
      </div>

      <form class="property-tag" id="department-login-form"> 
        <div class="tag-notch" aria-hidden="true"><span></span></div>
        <div class="tag-edge" aria-hidden="true"></div>
        <div class="tag-grid" aria-hidden="true"></div>

        <div class="tag-topline">
          <span class="tag-category">PROPERTY ACCESS TAG</span>
        </div>

        <div class="tag-brand-row">
          <img src="assets/images/logo.png" alt="">
          <div>
            <strong>UNIVERSITY OF CAMARINES<br>NORTE</strong>
          </div>
        </div>

        <div class="tag-rule card-rule"></div>

        <div class="tag-title-block">
          <span class="tag-field-label">AUTHORIZED UNIT</span>
          <strong id="tag-department">SELECT DEPARTMENT</strong>
        </div>

        <div class="tag-form-fields">
          <label class="tag-field">
            <span class="tag-field-label">DEPARTMENT</span>
            <span class="field-control">
              <span class="field-mark">01</span>
              <select id="login-department" required aria-label="Department">
                <option value="" disabled selected>Select department</option>
                <option value="MAIN">MAIN</option>
                <option value="COTT">COTT</option>
                <option value="CFAST">CFAST</option>
                <option value="CCMS">CCMS</option>
                <option value="COED">COED</option>
                <option value="ENTIENZA">ENTIENZA</option>
                <option value="CBPA">CBPA</option>
                <option value="CANR">CANR</option>
                <option value="COENG">COENG</option>
                <option value="CAS">CAS</option>
              </select>
              <span class="select-arrow" aria-hidden="true">+</span>
            </span>
          </label>

          <label class="tag-field">
            <span class="tag-field-label">ACCESS KEY</span>
            <span class="field-control">
              <span class="field-mark">02</span>
              <input id="login-password" type="password" placeholder="Enter department password" autocomplete="current-password" required>
              <button class="reveal-key" type="button" id="reveal-password" aria-label="Show password">SHOW</button>
            </span>
          </label>
        </div>

        <div class="tag-actions">
          <label class="remember-choice">
            <input id="login-remember" type="checkbox">
            <span class="check-box" aria-hidden="true"></span>
            Keep this department selected
          </label>
        </div>

        <button class="issue-button" type="submit">
          <span>VERIFY &amp; OPEN DESK</span>
          <span class="button-arrow" aria-hidden="true">-&gt;</span>
        </button>
        <p class="tag-error" id="department-login-error" role="alert" aria-live="polite"></p>

        <div class="tag-footer card-footer">
          <span class="footer-barcode" aria-hidden="true">|| | |||| || | |||</span>
          <span>UCN-SPMO</span>
        </div>
      </form>
    </section>
  </main>

  <script src="assets/js/login-prototype.js?v=20260914.1"></script>
</body>
</html>
